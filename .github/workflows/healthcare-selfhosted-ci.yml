name: HealthCare Self-Hosted CI - Jhansi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-on-ec2:
    name: Build and test on EC2 runner
    runs-on: [self-hosted, linux, java-build]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: healthcare-microservices/doctor-service
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Show runner details
        timeout-minutes: 2
        run: |
          echo "Running on host: $(hostname)"
          whoami
          java -version
          mvn -v
          docker --version

      - name: Run unit tests
        timeout-minutes: 10
        run: mvn -B -ntp test

      - name: Build Docker image
        timeout-minutes: 10
        run: docker build -t doctor-service:selfhosted .
